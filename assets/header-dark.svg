<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360">
<defs>
  <pattern id="grid" width="72" height="72" x="32" y="0" patternUnits="userSpaceOnUse">
    <path d="M0 0V72M0 0H72" fill="none" stroke="rgba(232,116,63,0.08)" stroke-width="1"/>
  </pattern>
  <clipPath id="card"><rect width="1000" height="360" rx="16"/></clipPath>
</defs>
<style>
  @font-face{font-family:'ed-display';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ed-displayItalic';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ed-mono';src:url(data:font/woff2;base64,) format('woff2');}
  text { white-space: pre; }
  .name { font-family:'ed-display','Cormorant Garamond',Georgia, serif; font-size: 68px; letter-spacing: -0.025em; fill: #faf8f5; }
  .name .em { font-family:'ed-displayItalic','Cormorant Garamond',Georgia, serif;font-style:italic; font-weight: 500; fill: #e8743f; }
  .loc { font-family:'ed-mono','Geist Mono',ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; fill: #9a8c7e; }
  .role { font-family:'ed-mono','Geist Mono',ui-monospace, monospace; font-size: 15.5px; letter-spacing: 0.108em; fill: #e8743f; }
  .tag { font-family:'ed-display','Cormorant Garamond',Georgia, serif; font-size: 25px; fill: #faf8f5; }

  /* Media queries inside an SVG shown as an image see its rendered width, so on a phone
     (where the whole card is ~350px) the small lines grow and restack. They move via
     the wrapping group, since the entrance animation owns the text's own transform. */
  @media (max-width: 600px) {
    .loc { font-size: 26px; }
    .role { font-size: 30px; }
    .tag { font-size: 40px; }
    .m-loc { transform: translateY(16px); }
    .m-role { transform: translateY(40px); }
    .m-tag { transform: translateY(56px); }
    .divider { display: none; }
  }

  /* The site's opening, beat for beat: the name unblurs, then the rest rises in. */
  @keyframes reveal { from { opacity: 0; filter: blur(8px); } to { opacity: 1; filter: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { 0% { opacity: 1; } 40% { opacity: 0.65; } 100% { opacity: 1; } }
  .name { animation: reveal 0.75s cubic-bezier(0.16, 1, 0.3, 1) both; }
  .loc { animation: up 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
  .role { animation: up 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both, breathe 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards; }
  .tag { animation: up 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both; }
  .divider { animation: up 0.42s cubic-bezier(0.16, 1, 0.3, 1) 0.54s both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#card)">
  <rect width="1000" height="360" fill="#1a1714"/>
  <rect width="1000" height="360" fill="url(#grid)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="359" rx="15.5" fill="none" stroke="#4a3f36"/>
<text class="name" x="500" y="126" text-anchor="middle">Eduard <tspan class="em">Catalin</tspan> Dragu</text>
<g class="m-loc"><text class="loc" x="500" y="168" text-anchor="middle">MILAN, ITALY</text></g>
<g class="m-role"><text class="role" x="500" y="194" text-anchor="middle">PLATFORM ENGINEER</text></g>
<g class="m-tag"><text class="tag" x="500" y="240" text-anchor="middle">Vegan. Marathon runner. Occasionally on-call.</text></g>
<g class="divider">
  <path d="M436 278H490M510 278H564" stroke="#4a3f36" stroke-width="1"/>
  <circle cx="500" cy="278" r="3" fill="#e8743f"/>
</g>
</svg>
