<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="256" viewBox="0 0 1000 256">
<style>
  @font-face{font-family:'ed-mono';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ed-displayRegular';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'ed-sans';src:url(data:font/woff2;base64,) format('woff2');}
  text { white-space: pre; }
  .label { font-family:'ed-mono','Geist Mono',ui-monospace, monospace; font-size: 12px; letter-spacing: 0.12em; fill: #b04619; }
  .title { font-family:'ed-displayRegular','Cormorant Garamond',Georgia, serif; font-size: 32px; letter-spacing: -0.01em; fill: #1a1714; }
  .body { font-family:'ed-sans','DM Sans',system-ui, sans-serif; font-size: 15.5px; fill: #5a4e42; }
  .tick { font-family:'ed-mono','Geist Mono',ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; fill: #766859; }

  /* On a phone each card is ~110px wide: the one-liners go, labels and titles grow. */
  @media (max-width: 600px) {
    .body, .tick-mid { display: none; }
    .label { font-size: 26px; letter-spacing: 0.06em; }
    .title { font-size: 54px; }
    .tick { font-size: 22px; letter-spacing: 0.04em; }
    .m-title { transform: translateY(28px); }
  }

  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both; }
  .fill { animation: fade 0.6s cubic-bezier(0.23, 1, 0.32, 1) 1.1s both; }
  .static { display: none; }

  /* A rep: hold on the floor, drive up, pause at lockout, lower. */
  @keyframes rep { 0%, 18% { transform: none; } 42%, 58% { transform: translateY(-24px); } 86%, 100% { transform: none; } }
  .rep { animation: rep 3.2s cubic-bezier(0.23, 1, 0.32, 1) 0.6s infinite; }

  /* SMIL ignores CSS, so the travelling dot is swapped for a still one at the finish. */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .moving { display: none; }
    .static { display: inline; }
  }
</style>
<g transform="translate(0 0)">
  <rect x="0.5" y="0.5" width="311" height="255" rx="12" fill="#faf8f5" stroke="#e2dbd2"/>
  <text class="label" x="24" y="40">01 · RUN</text>
  <g class="m-title"><text class="title" x="24" y="84">Marathons.</text></g>
  <text class="body" x="24" y="110">Always training for the next one.</text>
  <path d="M24 177.0L30 177.7L36 179.4L42 180.9L48 180.6L54 178.8L60 177.1L66 177.2L72 178.8L78 180.8L84 182.7L90 185.4L96 189.3L102 193.6L108 196.2L114 196.1L120 194.0L126 191.6L132 189.6L138 187.5L144 184.6L150 181.9L156 180.9L162 181.8L168 183.1L174 183.0L180 181.3L186 179.3L192 177.9L198 176.8L204 175.3L210 173.7L216 173.4L222 175.8L228 180.2L234 184.8L240 187.9L246 190.1L252 192.0L258 193.6L264 193.7L270 191.7L276 188.8L282 186.9L288 186.9L288 206L24 206Z" fill="rgba(176,70,25,0.12)" class="fill"/>
  <path d="M24 206.5H288" stroke="#e2dbd2"/>
  <path id="run" d="M24 177.0L30 177.7L36 179.4L42 180.9L48 180.6L54 178.8L60 177.1L66 177.2L72 178.8L78 180.8L84 182.7L90 185.4L96 189.3L102 193.6L108 196.2L114 196.1L120 194.0L126 191.6L132 189.6L138 187.5L144 184.6L150 181.9L156 180.9L162 181.8L168 183.1L174 183.0L180 181.3L186 179.3L192 177.9L198 176.8L204 175.3L210 173.7L216 173.4L222 175.8L228 180.2L234 184.8L240 187.9L246 190.1L252 192.0L258 193.6L264 193.7L270 191.7L276 188.8L282 186.9L288 186.9" pathLength="1" fill="none" stroke="#b04619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw"/>
  <g class="moving" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.85;0.95;1" dur="7s" begin="1.8s" repeatCount="indefinite"/>
    <circle r="8" fill="rgba(176,70,25,0.12)"><animateMotion dur="7s" begin="1.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"><mpath href="#run"/></animateMotion></circle>
    <circle r="4" fill="#b04619"><animateMotion dur="7s" begin="1.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"><mpath href="#run"/></animateMotion></circle>
  </g>
  <circle class="static" cx="288" cy="186.9" r="4" fill="#b04619"/>
  <text class="tick " x="24" y="230" text-anchor="start">0</text><text class="tick tick-mid" x="156" y="230" text-anchor="middle">21.1</text><text class="tick " x="288" y="230" text-anchor="end">42.195 KM</text>
</g>
<g transform="translate(344 0)">
  <rect x="0.5" y="0.5" width="311" height="255" rx="12" fill="#faf8f5" stroke="#e2dbd2"/>
  <text class="label" x="24" y="40">02 · RIDE</text>
  <g class="m-title"><text class="title" x="24" y="84">Long rides.</text></g>
  <text class="body" x="24" y="110">In it for the climbs. And the coffee.</text>
  <path d="M24 202.5L30 201.3L36 198.3L42 196.8L48 198.2L54 200.3L60 200.2L66 197.4L72 194.5L78 194.1L84 196.0L90 197.0L96 195.2L102 191.6L108 189.5L114 190.3L120 191.9L126 191.4L132 188.2L138 184.7L144 183.9L150 185.2L156 186.0L162 183.8L168 179.8L174 177.3L180 177.6L186 178.9L192 178.1L198 174.5L204 170.7L210 169.4L216 170.5L222 170.9L228 168.4L234 164.2L240 161.2L246 161.2L252 162.2L258 161.1L264 157.3L270 153.2L276 151.5L282 152.2L288 152.4L288 206L24 206Z" fill="rgba(176,70,25,0.12)" class="fill"/>
  <path d="M24 206.5H288" stroke="#e2dbd2"/>
  <path id="ride" d="M24 202.5L30 201.3L36 198.3L42 196.8L48 198.2L54 200.3L60 200.2L66 197.4L72 194.5L78 194.1L84 196.0L90 197.0L96 195.2L102 191.6L108 189.5L114 190.3L120 191.9L126 191.4L132 188.2L138 184.7L144 183.9L150 185.2L156 186.0L162 183.8L168 179.8L174 177.3L180 177.6L186 178.9L192 178.1L198 174.5L204 170.7L210 169.4L216 170.5L222 170.9L228 168.4L234 164.2L240 161.2L246 161.2L252 162.2L258 161.1L264 157.3L270 153.2L276 151.5L282 152.2L288 152.4" pathLength="1" fill="none" stroke="#b04619" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="draw"/>
  <g class="moving" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.85;0.95;1" dur="9s" begin="1.8s" repeatCount="indefinite"/>
    <circle r="8" fill="rgba(176,70,25,0.12)"><animateMotion dur="9s" begin="1.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"><mpath href="#ride"/></animateMotion></circle>
    <circle r="4" fill="#b04619"><animateMotion dur="9s" begin="1.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"><mpath href="#ride"/></animateMotion></circle>
  </g>
  <circle class="static" cx="288" cy="152.4" r="4" fill="#b04619"/>
  <text class="tick " x="24" y="230" text-anchor="start">BASE</text><text class="tick " x="288" y="230" text-anchor="end">SUMMIT</text>
</g>
<g transform="translate(688 0)">
  <rect x="0.5" y="0.5" width="311" height="255" rx="12" fill="#faf8f5" stroke="#e2dbd2"/>
  <text class="label" x="24" y="40">03 · LIFT</text>
  <g class="m-title"><text class="title" x="24" y="84">Hybrid.</text></g>
  <text class="body" x="24" y="110">Lift heavy, then run anyway.</text>
  <path d="M24 206.5H288" stroke="#e2dbd2"/>
  <g class="rep">
    <path d="M52 180H260" stroke="#5a4e42" stroke-width="3" stroke-linecap="round"/>
    <rect x="96" y="172" width="4" height="16" rx="2" fill="#1a1714"/><rect x="84" y="154" width="10" height="52" rx="2" fill="#b04619"/><rect x="74" y="160" width="8" height="40" rx="2" fill="#5a4e42"/><rect x="66" y="166" width="6" height="28" rx="2" fill="#766859"/><rect x="212" y="172" width="4" height="16" rx="2" fill="#1a1714"/><rect x="218" y="154" width="10" height="52" rx="2" fill="#b04619"/><rect x="230" y="160" width="8" height="40" rx="2" fill="#5a4e42"/><rect x="240" y="166" width="6" height="28" rx="2" fill="#766859"/>
  </g>
  <text class="tick " x="24" y="230" text-anchor="start">DEADLIFT</text><text class="tick " x="288" y="230" text-anchor="end">5×5</text>
</g>
</svg>
